
name: Build Mohammad Patrick APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MohammadPatrick-source (1).zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q 'MohammadPatrick-source (1).zip' -d source

      - name: Show extracted files
        run: find source -maxdepth 4 -type f | head -100
