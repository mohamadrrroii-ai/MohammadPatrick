
name: Build Mohammad Patrick APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MohammadPatrick-source (1).zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q 'MohammadPatrick-source (1).zip' -d source

      - name: Build APK
        run: gradle -p source/MohammadPatrick assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MohammadPatrick-APK
          path: source/MohammadPatrick/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
